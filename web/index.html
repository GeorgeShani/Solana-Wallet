    <!--
  THESIS: the wallet is a banknote, not a dashboard. Every address prints its own guilloche rosette; every result is a receipt struck line by line. Refuses the dark-purple crypto default.
  OWN-WORLD: cool bank-note paper (#e4efec) on a teal printing plate, one teal line ink, one serial red for ids and alerts, colour-shift foil only for "verified"; 1px hairlines, double-rule engraved buttons, round die-struck action seals, Bodoni numerals, Martian Mono serials.
  STORY: a beginner opens it, sees their money as a note with a serial number, gets test funds, and sends, swaps or mints with each result printed as proof.
  FIRST VIEWPORT: a 420px note-frame centered on the plate (full screen on phones); top guilloche band, 54px Bodoni balance, red serial line, four round seals (Send, Receive, Swap, Get funds), then assets with per-token medallions; five-tab bar.
  FORM: banknote security printing (assigned, seed 857792ae).
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
-->

  </body>
